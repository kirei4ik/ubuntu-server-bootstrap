[defaults]
# Базовые настройки Ansible
deprecation_warnings = False
host_key_checking = True
retry_files_enabled = False
gathering = smart
fact_caching = memory

# Пути к ролям
roles_path = ./roles

# Безопасность
remote_tmp = /tmp/ansible-$USER
local_tmp = /tmp/ansible-$USER

# Формат вывода (Ansible 2.13+). Убран устаревший 'stdout_callback = yaml',
# плагин 'community.general.yaml' удалён из collection 12.0.0.
result_format = yaml
bin_ansible_callbacks = True
callback_whitelist = timer, profile_tasks

# Python интерпретатор
interpreter_python = auto_silent

# SSH настройки
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/tmp/ansible-ssh-%h-%p-%r
pipelining = True
timeout = 30
# Passwords are supplied only by bootstrap's temporary inventory or explicitly
# with --ask-pass; do not prompt during normal key-based maintenance runs.

# Привилегии
[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

---
# Активационный этап настройки Ubuntu 22.04
# ⚠️ root будет заблокирован, пароли отключены!
# Запускать ТОЛЬКО после успешного playbook_prepare.yaml

- name: Активация безопасности Ubuntu 22.04
  hosts: all
  become: true
  gather_facts: true

  roles:
    - role: security_activate   # Перезапуск SSH, UFW, fail2ban

  post_tasks:
    - name: ✅ Инструкция проверки
      debug:
        msg: |
          ==============================================
          ✅ АКТИВАЦИЯ ЗАВЕРШЕНА

          root заблокирован SSH!

          Команды проверки:
          ssh bestadmin@{{ inventory_hostname }}
          sudo ufw status verbose
          sudo fail2ban-client status
          sudo apparmor_status
          ==============================================
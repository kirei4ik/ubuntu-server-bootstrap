---
# Подготовительный этап настройки Ubuntu 22.04
# Безопасен: НЕ перезапускает SSH, НЕ включает фаервол
# После выполнения → проверьте SSH подключение перед активацией!

- name: Подготовка системы Ubuntu 22.04 (безопасный этап)
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Проверить ОС
      fail:
        msg: "Требуется Ubuntu 22.04 и новее. Текущая: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
      when: ansible_facts.distribution != 'Ubuntu' or ansible_facts.distribution_major_version | int < 22

    - name: Показать текущие настройки SSH на сервере
      shell: |
        echo "=== Текущие настройки SSH ==="
        grep -E "^(Port|PermitRootLogin|PasswordAuthentication)" /etc/ssh/sshd_config || echo "Не найдено"
      register: current_ssh_config
      changed_when: false
      ignore_errors: yes

    - name: Вывести текущий SSH
      debug:
        var: current_ssh_config.stdout_lines

  roles:
    - role: common       # Создаёт пользователя bestadmin с sudo
    - role: security     # Подготовка (НЕ перезапускает SSH/UFW)
    - role: logging      # Настройка логов
    - role: kernel       # Оптимизация ядра
    # backup вынесен в playbook_backup.yaml

  post_tasks:
    - name: Инструкции
      debug:
        msg: |
          ==============================================
          ✅ ПОДГОТОВКА ЗАВЕРШЕНА

          Проверьте SSH подключение:
          ssh bestadmin@{{ inventory_hostname }}
          sudo ls /

          Если НЕ РАБОТАЕТ — не переходите к активации!
          Исправьте и повторите этот playbook.

          Если РАБОТАЕТ:
          ansible-playbook playbook_activate.yaml --ask-vault-pass
          ==============================================
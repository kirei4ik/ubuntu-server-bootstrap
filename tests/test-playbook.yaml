---
# Тестовый playbook для проверки настроек Ubuntu Server Setup 2026
# Запускать: ansible-playbook tests/test-playbook.yaml -i inventory.yaml

- name: Тестовый прогон - проверка доступности хостов
  hosts: all
  gather_facts: true
  become: false
  
  tasks:
    - name: Проверить доступность хоста
      ping:

    - name: Проверить версию ОС
      debug:
        msg: "ОС: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"

    - name: Проверить архитектуру
      debug:
        msg: "Архитектура: {{ ansible_architecture }}"

    - name: Проверить ядро
      debug:
        msg: "Ядро: {{ ansible_kernel }}"

- name: Тест - Базовая настройка
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Проверить установленные пакеты
      shell: |
        echo "=== Установленные пакеты ==="
        dpkg -l | grep -E "(curl|git|htop|vim|tmux|chrony|logrotate)" || echo "Некоторые пакеты не установлены"
      register: packages_check
      changed_when: false
      ignore_errors: yes

    - name: Показать пакеты
      debug:
        var: packages_check.stdout_lines

    - name: Проверить пользователей
      shell: |
        echo "=== Пользователи ==="
        cat /etc/passwd | grep -E "(admin|ansible)" || echo "Пользователи не настроены"
      register: users_check
      changed_when: false
      ignore_errors: yes

    - name: Показать пользователей
      debug:
        var: users_check.stdout_lines

    - name: Проверить chrony
      shell: |
        echo "=== Chrony статус ==="
        systemctl status chrony --no-pager || echo "Chrony не запущен"
      register: chrony_check
      changed_when: false
      ignore_errors: yes

    - name: Показать chrony статус
      debug:
        var: chrony_check.stdout_lines

- name: Тест - Безопасность
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Проверить SSH настройки
      shell: |
        echo "=== SSH настройки ==="
        grep -E "^(Port|PermitRootLogin|PasswordAuthentication|X11Forwarding|AllowTcpForwarding)" /etc/ssh/sshd_config || echo "SSH не настроен"
      register: ssh_check
      changed_when: false
      ignore_errors: yes

    - name: Показать SSH настройки
      debug:
        var: ssh_check.stdout_lines

    - name: Проверить UFW
      shell: |
        echo "=== UFW статус ==="
        ufw status verbose || echo "UFW не настроен"
      register: ufw_check
      changed_when: false
      ignore_errors: yes

    - name: Показать UFW статус
      debug:
        var: ufw_check.stdout_lines

    - name: Проверить fail2ban
      shell: |
        echo "=== Fail2ban статус ==="
        fail2ban-client status || echo "Fail2ban не настроен"
      register: fail2ban_check
      changed_when: false
      ignore_errors: yes

    - name: Показать fail2ban статус
      debug:
        var: fail2ban_check.stdout_lines

    - name: Проверить AppArmor
      shell: |
        echo "=== AppArmor статус ==="
        aa-status || echo "AppArmor не настроен"
      register: apparmor_check
      changed_when: false
      ignore_errors: yes

    - name: Показать AppArmor статус
      debug:
        var: apparmor_check.stdout_lines

    - name: Проверить auditd
      shell: |
        echo "=== Auditd статус ==="
        auditctl -l | head -10 || echo "Auditd не настроен"
      register: auditd_check
      changed_when: false
      ignore_errors: yes

    - name: Показать auditd правила
      debug:
        var: auditd_check.stdout_lines

- name: Тест - Логи
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Проверить journald
      shell: |
        echo "=== Journald статус ==="
        systemctl status systemd-journald --no-pager || echo "Journald не запущен"
        echo ""
        echo "Размер журналов:"
        journalctl --disk-usage || echo "Не удалось получить размер"
      register: journald_check
      changed_when: false
      ignore_errors: yes

    - name: Показать journald статус
      debug:
        var: journald_check.stdout_lines

    - name: Проверить logrotate
      shell: |
        echo "=== Logrotate конфигурация ==="
        logrotate -d /etc/logrotate.conf 2>&1 | tail -20 || echo "Logrotate не настроен"
      register: logrotate_check
      changed_when: false
      ignore_errors: yes

    - name: Показать logrotate конфигурацию
      debug:
        var: logrotate_check.stdout_lines

    - name: Проверить размер /var/log
      shell: |
        echo "=== Размер /var/log ==="
        du -sh /var/log || echo "Не удалось получить размер"
      register: varlog_size
      changed_when: false
      ignore_errors: yes

    - name: Показать размер /var/log
      debug:
        var: varlog_size.stdout_lines

- name: Тест - Ядро
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Проверить sysctl параметры
      shell: |
        echo "=== Sysctl параметры ==="
        sysctl -n vm.swappiness || echo "Не настроено"
        sysctl -n fs.file-max || echo "Не настроено"
        sysctl -n net.ipv4.tcp_syncookies || echo "Не настроено"
      register: sysctl_check
      changed_when: false
      ignore_errors: yes

    - name: Показать sysctl параметры
      debug:
        var: sysctl_check.stdout_lines

    - name: Проверить swap
      shell: |
        echo "=== Swap статус ==="
        swapon --show=NAME,SIZE,USED --noheadings || echo "Swap не настроен"
      register: swap_check
      changed_when: false
      ignore_errors: yes

    - name: Показать swap статус
      debug:
        var: swap_check.stdout_lines

    - name: Проверить ulimits
      shell: |
        echo "=== Ulimits ==="
        ulimit -a || echo "Не удалось получить ulimits"
      register: ulimits_check
      changed_when: false
      ignore_errors: yes

    - name: Показать ulimits
      debug:
        var: ulimits_check.stdout_lines

- name: Тест - Мониторинг
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Проверить node_exporter
      shell: |
        echo "=== Node_exporter статус ==="
        systemctl status node_exporter --no-pager || echo "Node_exporter не запущен"
      register: node_exporter_check
      changed_when: false
      ignore_errors: yes

    - name: Показать node_exporter статус
      debug:
        var: node_exporter_check.stdout_lines

    - name: Проверить метрики node_exporter
      shell: |
        echo "=== Node_exporter метрики ==="
        curl -s http://localhost:9100/metrics | head -10 || echo "Не удалось получить метрики"
      register: metrics_check
      changed_when: false
      ignore_errors: yes

    - name: Показать метрики
      debug:
        var: metrics_check.stdout_lines

- name: Тест - Бэкапы
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Проверить restic
      shell: |
        echo "=== Restic версия ==="
        restic version || echo "Restic не установлен"
      register: restic_check
      changed_when: false
      ignore_errors: yes

    - name: Показать версию restic
      debug:
        var: restic_check.stdout_lines

    - name: Проверить репозиторий
      shell: |
        echo "=== Репозиторий бэкапов ==="
        restic -r /backup/repository --password-file /etc/backup/restic-password snapshots || echo "Репозиторий не настроен"
      register: repo_check
      changed_when: false
      ignore_errors: yes
      no_log: true

    - name: Показать репозиторий
      debug:
        var: repo_check.stdout_lines

    - name: Проверить таймеры
      shell: |
        echo "=== Таймеры бэкапов ==="
        systemctl status restic-backup.timer --no-pager || echo "Таймер не настроен"
      register: timer_check
      changed_when: false
      ignore_errors: yes

    - name: Показать таймеры
      debug:
        var: timer_check.stdout_lines

- name: Итоговый отчёт
  hosts: all
  gather_facts: false
  become: false

  tasks:
    - name: Вывести итог
      debug:
        msg: |
          =============================================
          ИТОГОВЫЙ ОТЧЁТ ТЕСТИРОВАНИЯ
          =============================================
          
          Все тесты выполнены. Проверьте вывод выше:
          
          1. Базовая настройка - проверьте пользователей и пакеты
          2. Безопасность - проверьте SSH, UFW, fail2ban
          3. Логи - проверьте journald и logrotate
          4. Ядро - проверьте sysctl и swap
          5. Мониторинг - проверьте node_exporter
          6. Бэкапы - проверьте restic и репозиторий
          
          =============================================
          
          Для исправления проблем запустите:
          ansible-playbook playbook.yaml --tags "problem_tag"
---
# Основной playbook для настройки Ubuntu Server 22.04 (2026)
# ВНИМАНИЕ: Перед запуском прочитайте раздел "МЕРЫ ПРЕДОСТОРОЖНОСТИ" ниже!

- name: ⚠️ ПРЕДУПРЕЖДЕНИЕ О БЕЗОПАСНОСТИ
  hosts: localhost
  connection: local
  gather_facts: false
  
  vars:
    # Флаг для тестового режима (безопасный пробный запуск)
    test_mode: false
    
    # Требовать подтверждение пользователя
    require_confirmation: true
  
  tasks:
    - name: Проверить режим выполнения
      debug:
        msg: |
          ==============================================
          ⚠️  КРИТИЧЕСКОЕ ПРЕДУПРЕЖДЕНИЕ БЕЗОПАСНОСТИ  ⚠️
          ==============================================
          
          Этот плейбук внесёт КРИТИЧЕСКИЕ изменения в систему:
          
          🔐 Безопасность:
          - Изменит настройки SSH (возможно, заблокирует доступ!)
          - Включит фаервол (UFW) с правилами
          - Настроит fail2ban (бан IP при атаках)
          - Установит AppArmor (ограничения для программ)
          
          📋 Требования ПЕРЕД запуском:
          
          1. ✅ Иметь SSH доступ ПО КЛЮЧУ (не по паролю!)
          2. ✅ Проверить что ваш ключ в ~/.ssh/authorized_keys
          3. ✅ Проверить вход командой: ssh -i [ключ] [user]@[server]
          4. ✅ Иметь РЕЗЕРВНЫЙ доступ (консоль, VNC, IPMI)
          5. ✅ Сделать бэкап важных конфигураций
          
          📚 Команды для проверки:
          
          # Проверить текущий порт SSH
          sudo grep -E '^(Port|PasswordAuthentication|PermitRootLogin)' /etc/ssh/sshd_config
          
          # Проверить ваш ключ на сервере
          grep your_key ~/.ssh/authorized_keys
          
          # Протестировать вход по ключу
          ssh -i ~/.ssh/id_rsa user@server echo "Тест успешен"
          
          🔧 Тестовый режим (рекомендуется сначала):
          ansible-playbook playbook.yaml --tags "test" --check --diff
          
          🚨 Если потеряете доступ:
          1. Используйте консоль управления (IPMI/KVM)
          2. Или резервный SSH порт (если настроен)
          3. Или восстановитесь из бэкапа
          
          Продолжить? (если уверены - установите require_confirmation: false)
          ==============================================
      when: require_confirmation and not test_mode
    
    - name: Запросить подтверждение у пользователя
      pause:
        prompt: "⚠️  Вы уверены что хотите продолжить? (yes/no)"
      when: require_confirmation and not test_mode
    
    - name: Проверить доступность SSH (предварительная проверка)
      wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(22) }}"
        timeout: 30
      delegate_to: localhost
      run_once: true
      when: not test_mode

- name: Установка базовой системы Ubuntu 22.04
  hosts: all
  become: true
  gather_facts: true
  
  # Порядок выполнения ролей (важен!)
  pre_tasks:
    - name: Проверить ОС (должна быть Ubuntu 22.04)
      fail:
        msg: "Этот плейбук работает только с Ubuntu 22.04 и новее. Текущая система: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
      when: >
        ansible_facts.distribution != 'Ubuntu' or
        ansible_facts.distribution_major_version | int < 22
  
  roles:
    # 1. Базовая настройка системы (первая!)
    - role: common

    # 2. Настройка безопасности (вторая!)
    - role: security

    # 3. Управление логами (третья!)
    - role: logging

    # 4. Оптимизация ядра и производительности
    - role: kernel
  
  post_tasks:
    - name: Запуск systemctl daemon-reload после всех изменений
      systemd:
        daemon_reload: yes
    
    - name: Перезагрузка системы (если требуется)
      reboot:
        msg: "Требуется перезагрузка для применения изменений ядра"
        reboot_timeout: 300
      when: reboot_required.stat.exists
  
    - name: Проверка завершения настройки
      debug:
        msg: |
          ✅ Настройка завершена!
          
          📋 Что было настроено:
          - Базовая система (обновления, пользователи, время)
          - Безопасность (UFW, SSH, fail2ban, AppArmor)
          - Логи (ограничение размеров, ротация)
          - Ядро (оптимизация производительности)
          - Мониторинг (метрики системы)
          - Бэкапы (автоматическое резервное копирование)
          
          🔍 Рекомендуется проверить:
          1. SSH доступ всё ещё работает
          2. Фаервол не блокирует нужные порты
          3. fail2ban корректно работает
          4. Бэкапы создались успешно
          
          📚 Полезные команды для проверки:
          sudo ufw status verbose
          sudo fail2ban-client status
          sudo apparmor_status
          sudo journalctl --disk-usage
          sudo restic snapshots

- name: 🧪 ТЕСТОВЫЙ РЕЖИМ (безопасная проверка)
  hosts: all
  gather_facts: false
  become: false
  
  tasks:
    - name: Проверить подключение к хостам
      ping:
    
    - name: Проверить доступность SSH
      wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(22) }}"
        timeout: 10
      delegate_to: localhost
    
    - name: Вывести информацию о системе
      debug:
        var: ansible_facts
    
    - name: Показать что БУДЕТ сделано в тестовом режиме
      debug:
        msg: |
          🧪 ТЕСТОВЫЙ РЕЖИМ (безопасная проверка)
          
          В тестовом режиме изменения НЕ применяются.
          Используйте для проверки:
          
          ansible-playbook playbook.yaml --check --diff
          
          Что будет проверено:
          - Доступность всех хостов
          - SSH подключение работает
          - ОС соответствует требованиям
          - Достаточно прав для выполнения
          
          Для реального запуска уберите --check --diff
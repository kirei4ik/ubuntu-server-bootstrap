---
# Роль АКТИВАЦИИ бэкапов (выполняется ТОЛЬКО в playbook_activate.yaml)
# Создаёт репозиторий restic и настраивает автоматические бэкапы

- name: Проверить что restic установлен
  command: restic version
  register: restic_ver
  changed_when: false
  ignore_errors: yes
  tags:
    - check

- name: Создать файл с паролем для restic (только root)
  copy:
    content: "{{ vault_restic_password }}"
    dest: /etc/backup/restic-password
    owner: root
    group: root
    mode: '0400'
  no_log: true
  tags:
    - password

- name: ====== ИНИЦИАЛИЗАЦИЯ РЕПОЗИТОРИЯ RESTIC ======
  block:
    - name: Проверить существование репозитория
      command: |
        restic snapshots --repo /backup/repository \
          --password-file /etc/backup/restic-password
      register: repo_check
      changed_when: false
      ignore_errors: yes
      no_log: true

    - name: Инициализировать репозиторий
      command: |
        restic init --repo /backup/repository \
          --password-file /etc/backup/restic-password
      when: repo_check.rc != 0
      no_log: true

    - name: Показать статус репозитория
      debug:
        msg: "Репозиторий restic инициализирован"
      when: repo_check.rc == 0
  tags:
    - repository

- name: ====== СКРИПТЫ БЭКАПА ======
  block:
    - name: Создать скрипт для бэкапа
      template:
        src: backup.sh.j2
        dest: /usr/local/sbin/backup.sh
        owner: root
        group: root
        mode: '0700'

    - name: Создать скрипт для восстановления
      template:
        src: restore.sh.j2
        dest: /usr/local/sbin/restore.sh
        owner: root
        group: root
        mode: '0700'

    - name: Создать скрипт для проверки бэкапов
      template:
        src: verify-backup.sh.j2
        dest: /usr/local/sbin/verify-backup.sh
        owner: root
        group: root
        mode: '0700'

    - name: Создать скрипт для удаления старых бэкапов
      template:
        src: forget-backup.sh.j2
        dest: /usr/local/sbin/forget-backup.sh
        owner: root
        group: root
        mode: '0700'
  tags:
    - scripts

- name: ====== SYSTEMD TIMERS ======
  block:
    - name: Создать systemd service для бэкапа
      template:
        src: restic-backup.service.j2
        dest: /etc/systemd/system/restic-backup.service
        owner: root
        group: root
        mode: '0644'

    - name: Создать systemd timer для ежедневного бэкапа
      template:
        src: restic-backup.timer.j2
        dest: /etc/systemd/system/restic-backup.timer
        owner: root
        group: root
        mode: '0644'

    - name: Создать systemd service для проверки
      template:
        src: restic-verify.service.j2
        dest: /etc/systemd/system/restic-verify.service
        owner: root
        group: root
        mode: '0644'

    - name: Создать systemd timer для проверки
      template:
        src: restic-verify.timer.j2
        dest: /etc/systemd/system/restic-verify.timer
        owner: root
        group: root
        mode: '0644'

    - name: Перезагрузить systemd
      systemd:
        daemon_reload: yes

    - name: Включить и запустить таймер бэкапов
      systemd:
        name: restic-backup.timer
        enabled: yes
        state: started

    - name: Включить таймер проверки
      systemd:
        name: restic-verify.timer
        enabled: yes
        state: started
  tags:
    - timers

- name: ====== ДОБАВЛЕНИЕ CRON ======
  block:
    - name: Добавить cron для еженедельной очистки
      cron:
        name: "Очистка старых бэкапов"
        minute: "0"
        hour: "2"
        weekday: "0"
        job: "/usr/local/sbin/forget-backup.sh > /dev/null 2>&1"
        user: root
        state: present
  tags:
    - cron

- name: ====== ФИНАЛЬНЫЕ ПРОВЕРКИ ======
  block:
    - name: Проверить список снимков
      command: |
        restic snapshots --repo /backup/repository \
          --password-file /etc/backup/restic-password --json
      register: snapshots
      changed_when: false
      ignore_errors: yes
      no_log: true

    - name: Показать статус репозитория
      debug:
        msg: "Репозиторий готов: {{ snapshots.stdout | length }} снимков"
      when: snapshots.rc == 0

    - name: Протестировать создание бэкапа
      command: /usr/local/sbin/backup.sh
      register: test_backup
      changed_when: true
      ignore_errors: yes

    - name: Показать результат теста
      debug:
        var: test_backup.stdout_lines
      when: test_backup.rc is defined and test_backup.rc == 0

    - name: Создать метрики для Prometheus
      template:
        src: backup-metrics.prom.j2
        dest: /var/lib/node_exporter/textfile_collector/backup.prom
        owner: root
        group: root
        mode: '0644'

    - name: Показать инструкции
      debug:
        msg: |
          ==============================================
          Бэкапы настроены!
          
          Команды:
          sudo /usr/local/sbin/backup.sh          # Ручной бэкап
          sudo /usr/local/sbin/restore.sh        # Восстановление
          sudo /usr/local/sbin/verify-backup.sh  # Проверка
          sudo restic snapshots                    # Список снимков
          sudo restic check                        # Проверка целостности
          
          Автоматические бэкапы: каждый день в 04:00
          Проверка целостности: каждое воскресенье в 03:00
          ==============================================
  tags:
    - verify
---
# Handlers для роли monitoring

- name: Restart node_exporter
  systemd:
    name: node_exporter
    state: restarted
    daemon_reload: yes

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Restart netdata
  systemd:
    name: netdata
    state: restarted
    daemon_reload: yes

- name: Restart smartd
  systemd:
    name: smartd
    state: restarted
    daemon_reload: yes

- name: Restart cron
  systemd:
    name: cron
    state: restarted
    daemon_reload: yes